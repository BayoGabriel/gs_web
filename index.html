<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="GitShop is the distribution layer for commerce. Wholesalers publish a managed catalogue; sellers fork it into their own storefront. GitShop runs the orders, the payments and the payouts."
    />
    <link rel="preload" as="image" href="/images/hero-photo-1.webp" fetchpriority="high" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitShop" />
    <meta property="og:image" content="/og-image-light.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('gitshop-theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : dark
                ? 'dark'
                : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>GitShop — Distribution, made easy.</title>
  </head>
  <body>
    <div id="root">
      <style>
        #gs-splash {
          position: fixed; inset: 0; display: grid; place-items: center;
          background: #fff; color: #000;
        }
        html[data-theme='dark'] #gs-splash { background: #000; color: #fff }
        #gs-splash rect { stroke: #fff; stroke-width: 5; }
        html[data-theme='dark'] #gs-splash rect { stroke: #000; }
        /* The three squares collapse onto each other, then fan back out —
           the logo assembling itself while the app loads. */
        @media (prefers-reduced-motion: no-preference) {
          #gs-splash .sp-layer { animation: gs-stack 2s cubic-bezier(.2, 0, 0, 1) infinite; }
          #gs-splash .sp-mid { animation-delay: .12s; }
          #gs-splash .sp-back { animation-delay: .24s; }
        }
        @keyframes gs-stack {
          0%, 12% { transform: translate(var(--gs-ov), var(--gs-ov)); }
          55%, 72% { transform: translate(0, 0); }
          100% { transform: translate(var(--gs-ov), var(--gs-ov)); }
        }
      </style>
      <div id="gs-splash" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56" fill="currentColor" aria-hidden="true">
          <rect class="sp-layer sp-back" style="--gs-ov: 20px" x="5" y="5" width="34" height="34" rx="9" />
          <rect class="sp-layer sp-mid" style="--gs-ov: 10px" x="15" y="15" width="34" height="34" rx="9" />
          <rect x="25" y="25" width="34" height="34" rx="9" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
